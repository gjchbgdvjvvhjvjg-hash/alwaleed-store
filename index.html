<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الوليد للمجوهرات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080808;
    color:white;
}

header{
    padding:18px 6%;
    background:#0d0d0d;
    border-bottom:1px solid #3d3016;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#e5c568;
    font-size:24px;
    font-weight:bold;
}

.cart{
    background:#d9b653;
    color:#111;
    border:0;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:90px 20px;
    background:radial-gradient(circle,#4a3712,#080808 70%);
}

.hero h1{
    color:#e5c568;
    font-size:42px;
}

.hero p{
    color:#ddd;
    font-size:19px;
}

section{
    padding:55px 6%;
}

.title{
    text-align:center;
    color:#e5c568;
    margin-bottom:35px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
}

.card{
    background:#151515;
    border:1px solid #3d3016;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.gem{
    height:190px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0d0d0d;
    border-radius:12px;
    font-size:80px;
}

.price{
    color:#e5c568;
    font-size:21px;
    font-weight:bold;
    margin:15px;
}

.buy{
    background:#25D366;
    color:white;
    border:0;
    padding:12px 22px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.loading{
    text-align:center;
    color:#aaa;
    font-size:20px;
}

footer{
    text-align:center;
    padding:30px;
    color:#aaa;
    border-top:1px solid #333;
}

.whatsapp{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#25D366;
    color:white;
    padding:14px 20px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<header>

<div class="logo">💎 الوليد للمجوهرات</div>

<button class="cart">
🛒 السلة <span id="count">0</span>
</button>

</header>

<section class="hero">

<h1>الوليد للمجوهرات والأحجار الكريمة</h1>

<p>الفخامة تلتقي بأصالة الأحجار الكريمة</p>

</section>

<section>

<h2 class="title">💎 منتجاتنا</h2>

<div id="products" class="products">

<div class="loading">
جار تحميل المنتجات...
</div>

</div>

</section>

<section>

<h2 class="title">من نحن</h2>

<p style="text-align:center;line-height:2;color:#ddd">
متجر الوليد للمجوهرات والأحجار الكريمة يقدم
قطعًا مميزة تجمع بين الفخامة والأصالة.
</p>

</section>

<a class="whatsapp"
href="https://wa.me/963933797014"
target="_blank">
💬 واتساب
</a>

<footer>
© 2026 متجر الوليد للمجوهرات والأحجار الكريمة
</footer>

<script>

const SUPABASE_URL =
"https://lxalfbcvibapprsyyrwd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Pij7dZ58tg5RaDIZFPbEzw_a5PB655X";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let cartCount = 0;

async function loadProducts(){

    const container =
    document.getElementById("products");

    try{

        const result =
        await db
        .from("products")
        .select("id,name,price")
        .order("id",{ascending:true});

        if(result.error){
            throw result.error;
        }

        const products =
        result.data || [];

        if(products.length === 0){

            container.innerHTML =
            "<div class='loading'>لا توجد منتجات حاليًا.</div>";

            return;
        }

        container.innerHTML = "";

        products.forEach(product => {

            const card =
            document.createElement("div");

            card.className = "card";

            card.innerHTML = `

                <div class="gem">
                    💎
                </div>

                <h3>
                    ${escapeHTML(product.name)}
                </h3>

                <div class="price">
                    ${Number(product.price).toLocaleString()}
                    ل.س
                </div>

                <button class="buy">
                    🛒 إضافة للسلة
                </button>

            `;

            card
            .querySelector(".buy")
            .addEventListener("click",function(){

                cartCount++;

                document
                .getElementById("count")
                .textContent = cartCount;

                alert(
                    "تمت إضافة " +
                    product.name +
                    " إلى السلة 🛒"
                );

            });

            container.appendChild(card);

        });

    }catch(error){

        console.error(error);

        container.innerHTML = `
        <div class="loading">
        حدث خطأ في تحميل المنتجات.<br><br>
        تأكد من إعداد صلاحيات جدول products.
        </div>
        `;

    }

}

function escapeHTML(text){

    const div =
    document.createElement("div");

    div.textContent =
    text ?? "";

    return div.innerHTML;

}

loadProducts();

</script>

</body>
</html>
