<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة متجر الوليد</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#080808;
color:#fff;
}

header{
background:#0d0d0d;
border-bottom:1px solid #3d3016;
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#e5c568;
font-size:23px;
font-weight:bold;
}

button{
border:0;
border-radius:8px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
}

.back{
background:#333;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:25px 15px;
}

h1,h2{
color:#e5c568;
}

.panel{
background:#151515;
border:1px solid #3d3016;
border-radius:15px;
padding:22px;
margin-bottom:22px;
}

input{
width:100%;
padding:14px;
margin:7px 0;
background:#0d0d0d;
border:1px solid #444;
border-radius:8px;
color:white;
font-size:16px;
}

.add{
width:100%;
background:#25D366;
color:white;
margin-top:8px;
}

.product{
background:#101010;
border:1px solid #333;
border-radius:12px;
padding:18px;
margin-top:14px;
}

.name{
color:#e5c568;
font-size:19px;
font-weight:bold;
}

.price{
margin:9px 0 15px;
color:#ddd;
}

.edit{
background:#d9b653;
color:#111;
margin-left:7px;
}

.delete{
background:#b32626;
color:white;
}

.status{
text-align:center;
color:#aaa;
padding:15px;
line-height:1.8;
}

.error{
color:#ff7777;
text-align:center;
margin-top:10px;
line-height:1.7;
}

.success{
color:#5cff91;
text-align:center;
padding:10px;
}

.small{
font-size:13px;
color:#aaa;
word-break:break-word;
}

#login{
max-width:450px;
margin:80px auto;
padding:25px;
}

.loading{
opacity:.7;
pointer-events:none;
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->

<div id="login" class="panel">

<h1>💎 الوليد</h1>

<h2>🔐 دخول الإدارة</h2>

<input
id="password"
type="password"
placeholder="أدخل كلمة المرور"
autocomplete="current-password"
>

<button class="add" onclick="login()">
دخول
</button>

<div id="error" class="error"></div>

</div>


<!-- لوحة الإدارة -->

<div id="admin" style="display:none">

<header>

<div class="logo">
💎 الوليد - الإدارة
</div>

<button class="back" onclick="goStore()">
🏪 المتجر
</button>

</header>

<div class="container">

<h1>لوحة إدارة المنتجات</h1>


<!-- إضافة منتج -->

<div class="panel">

<h2>➕ إضافة منتج</h2>

<input
id="name"
type="text"
placeholder="اسم المنتج"
>

<input
id="price"
type="number"
min="0"
step="1"
placeholder="السعر بالليرة السورية"
>

<button
id="addButton"
class="add"
onclick="addProduct()"
>
إضافة المنتج
</button>

<div id="addStatus"></div>

</div>


<!-- المنتجات -->

<div class="panel">

<h2>💎 المنتجات</h2>

<div id="products">
<div class="status">
جار تحميل المنتجات...
</div>
</div>

</div>

</div>
</div>


<script>

/* =========================
   إعدادات Supabase
========================= */

const SUPABASE_URL =
"https://lxalfbcvibapprsyyrwd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Pij7dZ58tg5RaDIZFPbEzw_a5PB655X";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   كلمة مرور الإدارة
========================= */

const ADMIN_PASSWORD = "0967300235Aa";


/* =========================
   تسجيل الدخول
========================= */

function login(){

const password =
document.getElementById("password").value;

const error =
document.getElementById("error");

if(password === ADMIN_PASSWORD){

error.textContent = "";

document.getElementById("login").style.display = "none";

document.getElementById("admin").style.display = "block";

loadProducts();

}else{

error.textContent =
"❌ كلمة المرور غير صحيحة";

}

}


/* السماح بالضغط على Enter */

document
.getElementById("password")
.addEventListener("keydown", function(e){

if(e.key === "Enter"){
login();
}

});


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML =
'<div class="status">⏳ جار تحميل المنتجات...</div>';

try{

const { data, error } = await db
.from("products")
.select("*")
.order("created_at", {
ascending:false
});

if(error){

console.error("Supabase error:", error);

box.innerHTML = `
<div class="status error">
❌ حدث خطأ في تحميل المنتجات
<br><br>
<div class="small">
${escapeHtml(error.message)}
</div>
<br>
<div class="small">
الكود: ${escapeHtml(error.code || "غير متوفر")}
</div>
</div>
`;

return;
}


if(!data || data.length === 0){

box.innerHTML =
'<div class="status">📦 لا توجد منتجات حاليًا</div>';

return;
}


box.innerHTML = "";

data.forEach(product => {

const item =
document.createElement("div");

item.className = "product";


const name =
document.createElement("div");

name.className = "name";

name.textContent =
product.name || "بدون اسم";


const price =
document.createElement("div");

price.className = "price";

price.textContent =
Number(product.price || 0).toLocaleString("ar-SY")
+ " ل.س";


const edit =
document.createElement("button");

edit.className = "edit";

edit.textContent = "✏️ تعديل";

edit.onclick = function(){

editProduct(
product.id,
product.name || "",
product.price || 0
);

};


const del =
document.createElement("button");

del.className = "delete";

del.textContent = "🗑️ حذف";

del.onclick = function(){

deleteProduct(product.id);

};


item.appendChild(name);

item.appendChild(price);

item.appendChild(edit);

item.appendChild(del);

box.appendChild(item);

});

}catch(err){

console.error(err);

box.innerHTML = `
<div class="status error">
❌ تعذر الاتصال بقاعدة البيانات
<br><br>
<div class="small">
${escapeHtml(err.message || String(err))}
</div>
</div>
`;

}

}


/* =========================
   إضافة منتج
========================= */

async function addProduct(){

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const status =
document.getElementById("addStatus");

const button =
document.getElementById("addButton");

const name =
nameInput.value.trim();

const price =
Number(priceInput.value);


if(!name){

status.innerHTML =
'<div class="error">اكتب اسم المنتج</div>';

return;
}


if(!Number.isFinite(price) || price <= 0){

status.innerHTML =
'<div class="error">اكتب سعرًا صحيحًا</div>';

return;
}


button.disabled = true;

button.textContent =
"⏳ جار الإضافة...";

status.innerHTML = "";


try{

const { error } = await db
.from("products")
.insert({
name:name,
price:price
});


if(error){

console.error("Insert error:", error);

status.innerHTML = `
<div class="error">
❌ لم تتم إضافة المنتج
<br>
<span class="small">
${escapeHtml(error.message)}
</span>
</div>
`;

return;
}


status.innerHTML =
'<div class="success">✅ تمت إضافة المنتج</div>';

nameInput.value = "";

priceInput.value = "";

await loadProducts();


}catch(err){

console.error(err);

status.innerHTML = `
<div class="error">
❌ حدث خطأ
<br>
<span class="small">
${escapeHtml(err.message || String(err))}
</span>
</div>
`;

}finally{

button.disabled = false;

button.textContent =
"إضافة المنتج";

}

}


/* =========================
   تعديل منتج
========================= */

async function editProduct(
id,
oldName,
oldPrice
){

const name =
prompt(
"اسم المنتج:",
oldName
);

if(name === null)return;


const cleanName =
name.trim();

if(!cleanName){

alert("اسم المنتج لا يمكن أن يكون فارغًا");

return;
}


const priceText =
prompt(
"السعر بالليرة السورية:",
oldPrice
);

if(priceText === null)return;


const price =
Number(priceText);

if(!Number.isFinite(price) || price <= 0){

alert("السعر غير صحيح");

return;
}


try{

const { error } = await db
.from("products")
.update({
name:cleanName,
price:price
})
.eq("id",id);


if(error){

console.error("Update error:", error);

alert(
"❌ لم يتم تعديل المنتج\n\n"
+ error.message
);

return;
}


alert("✅ تم تعديل المنتج");

loadProducts();


}catch(err){

console.error(err);

alert(
"❌ حدث خطأ\n\n"
+ (err.message || String(err))
);

}

}


/* =========================
   حذف منتج
========================= */

async function deleteProduct(id){

if(!confirm(
"هل تريد حذف هذا المنتج؟"
)){

return;
}


try{

const { error } = await db
.from("products")
.delete()
.eq("id",id);


if(error){

console.error("Delete error:", error);

alert(
"❌ لم يتم حذف المنتج\n\n"
+ error.message
);

return;
}


alert("✅ تم حذف المنتج");

loadProducts();


}catch(err){

console.error(err);

alert(
"❌ حدث خطأ\n\n"
+ (err.message || String(err))
);

}

}


/* =========================
   حماية النصوص
========================= */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   المتجر
========================= */

function goStore(){

window.location.href = "/";

}

</script>

</body>
</html>
