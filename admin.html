<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة متجر الوليد</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080808;
    color:#fff;
}

header{
    background:#0d0d0d;
    border-bottom:1px solid #3d3016;
    padding:20px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#e5c568;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:30px 20px;
}

h1,h2{
    color:#e5c568;
}

.panel{
    background:#151515;
    border:1px solid #3d3016;
    border-radius:15px;
    padding:25px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    background:#0d0d0d;
    border:1px solid #444;
    border-radius:8px;
    color:#fff;
    font-size:16px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn{
    width:100%;
    background:#25D366;
    color:#fff;
    margin-top:10px;
}

.product{
    background:#101010;
    border:1px solid #333;
    border-radius:12px;
    padding:18px;
    margin-top:15px;
}

.product-name{
    color:#e5c568;
    font-size:20px;
    font-weight:bold;
}

.product-price{
    margin:10px 0;
    color:#ddd;
}

.edit{
    background:#d9b653;
    color:#111;
    margin-left:8px;
}

.delete{
    background:#b32626;
    color:#fff;
}

.status{
    text-align:center;
    color:#aaa;
    padding:15px;
}

.back{
    background:#333;
    color:#fff;
}

@media(max-width:600px){
    header{
        padding:16px;
    }

    .container{
        padding:20px 12px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
💎 الوليد - الإدارة
</div>

<button class="back" onclick="goStore()">
🏪 المتجر
</button>

</header>

<div class="container">

<h1>لوحة إدارة المنتجات</h1>

<div class="panel">

<h2>➕ إضافة منتج</h2>

<input
id="name"
type="text"
placeholder="اسم المنتج">

<input
id="price"
type="number"
placeholder="السعر بالليرة السورية">

<button
class="add-btn"
onclick="addProduct()">

إضافة المنتج

</button>

</div>

<div class="panel">

<h2>💎 المنتجات
