<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة متجر الوليد</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#111;
    color:#fff;
}

.container{
    width:95%;
    max-width:900px;
    margin:30px auto;
}

h1{
    text-align:center;
    color:#d4af37;
    margin-bottom:25px;
}

.card{
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #444;
    background:#222;
    color:#fff;
    font-size:16px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    font-size:15px;
    margin:5px;
}

.login-btn,
.add-btn{
    background:#d4af37;
    color:#111;
    font-weight:bold;
}

.edit-btn{
    background:#3498db;
    color:#fff;
}

.delete-btn{
    background:#c0392b;
    color:#fff;
}

.logout-btn{
    background:#555;
    color:#fff;
}

.product{
    background:#222;
    border:1px solid #333;
    border-radius:12px;
    padding:15px;
    margin:12px 0;
}

.product h3{
    margin-top:0;
    color:#d4af37;
}

.price{
    color:#fff;
    font-weight:bold;
}

.status{
    text-align:center;
    padding:20px;
    border-radius:10px;
    background:#222;
    margin-top:15px;
    line-height:1.8;
}

.error{
    border:1px solid #c0392b;
    color:#ff7675;
}

.success{
    border:1px solid #27ae60;
    color:#2ecc71;
}

.hidden{
    display:none;
}

.actions{
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>💎 لوحة إدارة متجر الوليد</h1>

<!-- تسجيل الدخول -->
<div id="loginBox" class="card">

    <h2>تسجيل دخول الإدارة</h2>

    <input
        id="password"
        type="password"
        placeholder="أدخل كلمة مرور الإدارة"
    >

    <button class="login-btn" onclick="login()">
        دخول
    </button>

    <div id="loginStatus"></div>

</div>


<!-- لوحة التحكم -->
<div id="adminPanel" class="hidden">

    <div class="card">

        <button class="logout-btn" onclick="logout()">
            تسجيل الخروج
        </button>

        <h2>إضافة منتج</h2>

        <input
            id="name"
            type="text"
            placeholder="اسم المنتج"
        >

        <input
            id="price"
            type="number"
            placeholder="السعر"
        >

        <button class="add-btn" onclick="addProduct()">
            ➕ إضافة المنتج
        </button>

        <div id="actionStatus"></div>

    </div>


    <div class="card">

        <h2>📦 المنتجات</h2>

        <div id="products">
            <div class="status">
                جار تحميل المنتجات...
            </div>
        </div>

    </div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://lxalfbcvibapprsyyrwd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Pij7dZ58tg5RaDIZFPbEzw_a5PB655X";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   كلمة مرور الإدارة
========================= */

const ADMIN_PASSWORD = "0967300235Aa";


/* =========================
   حماية النصوص
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   تسجيل الدخول
========================= */

function login(){

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");


    if(password === ADMIN_PASSWORD){

        sessionStorage.setItem(
            "alwaleed_admin",
            "true"
        );

        document
            .getElementById("loginBox")
            .classList.add("hidden");

        document
            .getElementById("adminPanel")
            .classList.remove("hidden");

        status.innerHTML = "";

        loadProducts();

    }else{

        status.innerHTML =
        '<div class="status error">❌ كلمة المرور غير صحيحة</div>';

    }

}


/* =========================
   تسجيل الخروج
========================= */

function logout(){

    sessionStorage.removeItem(
        "alwaleed_admin"
    );

    location.reload();

}


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

    const box =
        document.getElementById("products");

    box.innerHTML =
        '<div class="status">⏳ جار تحميل المنتجات...</div>';


    try{

        const { data, error } =
            await db
                .from("products")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        /* =========================
           إظهار الخطأ الحقيقي
        ========================= */

        if(error){

            console.error(
                "Supabase error:",
                error
            );

            box.innerHTML = `
                <div class="status error">
                    ❌ خطأ في تحميل المنتجات
                    <br><br>

                    <strong>الرسالة:</strong>
                    ${escapeHtml(error.message)}

                    <br>

                    <strong>الكود:</strong>
                    ${escapeHtml(error.code || "غير معروف")}

                    <br>

                    <strong>التفاصيل:</strong>
                    ${escapeHtml(error.details || "لا توجد تفاصيل")}

                    <br>

                    <strong>الحل:</strong>
                    تحقق من صلاحيات جدول products في Supabase.
                </div>
            `;

            return;
        }


        if(!data || data.length === 0){

            box.innerHTML =
                '<div class="status">📦 لا توجد منتجات حالياً</div>';

            return;

        }


        box.innerHTML = "";


        data.forEach(product => {

            const div =
                document.createElement("div");

            div.className = "product";


            div.innerHTML = `

                <h3>
                    ${escapeHtml(product.name)}
                </h3>

                <div class="price">
                    السعر:
                    ${escapeHtml(product.price)}
                    ل.س
                </div>

                <div class="actions">

                    <button
                        class="edit-btn"
                        onclick="editProduct(
                            ${Number(product.id)},
                            '${escapeHtml(product.name).replace(/'/g,"\\'")}',
                            '${Number(product.price || 0)}'
                        )"
                    >
                        ✏️ تعديل
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(
                            ${Number(product.id)}
                        )"
                    >
                        🗑️ حذف
                    </button>

                </div>
            `;


            box.appendChild(div);

        });

    }catch(err){

        console.error(err);

        box.innerHTML = `
            <div class="status error">
                ❌ حدث خطأ غير متوقع
                <br><br>
                ${escapeHtml(err.message)}
            </div>
        `;

    }

}


/* =========================
   إضافة منتج
========================= */

async function addProduct(){

    const name =
        document.getElementById("name").value.trim();

    const price =
        document.getElementById("price").value;


    const status =
        document.getElementById("actionStatus");


    if(!name){

        status.innerHTML =
            '<div class="status error">اكتب اسم المنتج</div>';

        return;

    }


    if(!price){

        status.innerHTML =
            '<div class="status error">اكتب السعر</div>';

        return;

    }


    status.innerHTML =
        '<div class="status">⏳ جار إضافة المنتج...</div>';


    const { error } =
        await db
            .from("products")
            .insert([
                {
                    name:name,
                    price:Number(price)
                }
            ]);


    if(error){

        console.error(
            "Insert error:",
            error
        );

        status.innerHTML = `
            <div class="status error">
                ❌ فشل إضافة المنتج
                <br><br>
                ${escapeHtml(error.message)}
                <br>
                الكود:
                ${escapeHtml(error.code || "غير معروف")}
            </div>
        `;

        return;
    }


    status.innerHTML =
        '<div class="status success">✅ تمت إضافة المنتج بنجاح</div>';


    document.getElementById("name").value = "";
    document.getElementById("price").value = "";


    loadProducts();

}


/* =========================
   تعديل منتج
========================= */

async function editProduct(id,name,price){

    const newName =
        prompt(
            "اسم المنتج:",
            name
        );


    if(newName === null)
        return;


    const newPrice =
        prompt(
            "السعر:",
            price
        );


    if(newPrice === null)
        return;


    if(!newName.trim()){

        alert("اسم المنتج لا يمكن أن يكون فارغاً");

        return;

    }


    if(!newPrice || isNaN(newPrice)){

        alert("السعر غير صحيح");

        return;

    }


    const { error } =
        await db
            .from("products")
            .update({
                name:newName.trim(),
                price:Number(newPrice)
            })
            .eq(
                "id",
                id
            );


    if(error){

        console.error(
            "Update error:",
            error
        );

        alert(
            "فشل تعديل المنتج:\n\n" +
            error.message
        );

        return;

    }


    alert(
        "✅ تم تعديل المنتج"
    );


    loadProducts();

}


/* =========================
   حذف منتج
========================= */

async function deleteProduct(id){

    const confirmDelete =
        confirm(
            "هل أنت متأكد من حذف هذا المنتج؟"
        );


    if(!confirmDelete)
        return;


    const { error } =
        await db
            .from("products")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        console.error(
            "Delete error:",
            error
        );

        alert(
            "فشل حذف المنتج:\n\n" +
            error.message
        );

        return;

    }


    alert(
        "✅ تم حذف المنتج"
    );


    loadProducts();

}


/* =========================
   Enter لتسجيل الدخول
========================= */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                login();

            }

        }
    );


/* =========================
   فتح اللوحة إذا كان مسجل
========================= */

if(
    sessionStorage.getItem(
        "alwaleed_admin"
    ) === "true"
){

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("adminPanel")
        .classList.remove("hidden");

    loadProducts();

}

</script>

</body>
</html>
