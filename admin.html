<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة تحكم الوليد</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#080808;
color:#fff;
}

header{
padding:22px 6%;
background:#0d0d0d;
border-bottom:1px solid #3d3016;
}

h1{
margin:0;
color:#e5c568;
}

.container{
padding:35px 6%;
max-width:1100px;
margin:auto;
}

.panel{
background:#151515;
border:1px solid #3d3016;
border-radius:15px;
padding:25px;
margin-bottom:25px;
}

input{
width:100%;
padding:13px;
margin:8px 0;
background:#0b0b0b;
border:1px solid #444;
border-radius:7px;
color:#fff;
}

button{
background:#d9b653;
border:0;
padding:12px 20px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.product{
border-bottom:1px solid #333;
padding:15px 0;
}

.delete{
background:#b32626;
color:#fff;
}

.success{
color:#25D366;
margin-top:15px;
}
</style>
</head>

<body>

<header>
<h1>💎 لوحة تحكم متجر الوليد</h1>
</header>

<div class="container">

<div class="panel">

<h2>➕ إضافة منتج</h2>

<input id="name" placeholder="اسم المنتج">

<input id="price" type="number" placeholder="السعر">

<button onclick="addProduct()">
إضافة المنتج
</button>

<div id="message"></div>

</div>

<div class="panel">

<h2>📦 المنتجات</h2>

<div id="products"></div>

</div>

<div class="panel">

<h2>🏪 معلومات المتجر</h2>

<p>👤 الإدارة: محمد حسنو – أبو وليد</p>

<p>🕗 ساعات العمل: 8 صباحًا – 8 مساءً</p>

<p>📱 واتساب: 963933797014</p>

<p>📍 سوريا – حمص – مدينة الحولة – بلدة تلذهب</p>

</div>

</div>

<script>

let products=
JSON.parse(localStorage.getItem("alwaleedProducts")||"[]");

function save(){

localStorage.setItem(
"alwaleedProducts",
JSON.stringify(products)
);

}

function addProduct(){

let name=
document.getElementById("name").value.trim();

let price=
Number(document.getElementById("price").value);

if(!name||!price){

alert("اكتب اسم المنتج والسعر.");

return;
}

products.push({
name:name,
price:price
});

save();

document.getElementById("name").value="";
document.getElementById("price").value="";

document.getElementById("message").innerHTML=
"<div class='success'>تمت إضافة المنتج.</div>";

render();

}

function deleteProduct(index){

products.splice(index,1);

save();

render();

}

function render(){

let box=document.getElementById("products");

box.innerHTML="";

if(products.length===0){

box.innerHTML=
"<p>لا توجد منتجات مضافة من لوحة التحكم حتى الآن.</p>";

return;
}

products.forEach((p,index)=>{

box.innerHTML+=`

<div class="product">

<strong>${p.name}</strong>

<p>${p.price.toLocaleString()} ل.س</p>

<button class="delete"
onclick="deleteProduct(${index})">
حذف
</button>

</div>

`;

});

}

render();

</script>

</body>
</html>
